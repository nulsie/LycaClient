<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LycaClient</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 style="color:#59AFFF; margin-bottom: 10px;">LycaClient</h1>
        <div class="search-box">
            <input type="text" id="handleInput" placeholder="Enter handle (e.g. jay.bsky.social)" style="width: 70%; display: inline-block;">
            <button onclick="fetchUserData()" style="width: 25%; display: inline-block;">Search</button>
        </div>
        
        <div id="authCard" class="card">
            <div id="loginForm">
                <input type="text" id="loginHandle" placeholder="Your handle">
                <input type="password" id="loginPassword" placeholder="App Password">
                <button onclick="loginUser()">Login</button>
            </div>
            <div id="loginStatus" class="hidden">
                <span class="stat-item">Logged in as <b id="loggedInName"></b></span>
                <button onclick="logoutUser()">Logout</button>
            </div>
        </div>

        <div id="postComposer" class="card hidden">
            <h3 style="margin-top:0;">Create a Post</h3>
            <textarea id="new-post-input" placeholder="What's up?"></textarea>
            <div class="align-right"><button onclick="submitPost()">Post</button></div>
        </div>

        <div id="profileCard" class="card hidden">
            <div class="clear-fix">
                <img id="pfp" src="" alt="PFP">
                <div class="user-info">
                    <h2 id="displayName"></h2>
                    <p id="handle"></p>
                </div>
            </div>
            <p id="bio"></p>
            <div class="stats clear-fix">
                <div class="stat-box"><b id="followers">0</b><br>Followers</div>
                <div class="stat-box"><b id="following">0</b><br>Following</div>
                <div class="stat-box"><b id="postsCount">0</b><br>Posts</div>
            </div>
            <hr style="border:1px solid #1e1f22; margin: 15px 0;">
            <h3 style="margin-top:0;">Latest Posts</h3>
            <div id="feed"></div>
            <button id="loadMoreBtn" class="hidden" onclick="loadMorePosts()" style="width:100%;">Load More Posts️</button>
        </div>
    </div>
    
    <div id="toastContainer"></div>
    
    <div id="lightbox" class="hidden" onclick="closeLightbox()">
        <div class="lightbox-content">
            <img id="lightboxImg" src="" alt="Enlarged view">
            <p style="color:#ccc;">Click anywhere to close</p>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
