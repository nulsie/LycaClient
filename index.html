<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LycaClient</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>LycaClient ️🦋</h1>
        <div class="controls-wrapper">
            <div class="theme-switcher">
                <button class="theme-btn" onclick="document.body.setAttribute('data-theme', 'light')">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg> Light
                </button>
                <button class="theme-btn" onclick="document.body.removeAttribute('data-theme')">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg> Dark
                </button>
                <button class="theme-btn" onclick="document.body.setAttribute('data-theme', 'midnight')">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg> Midnight
                </button>
            </div>
            
            <div class="search-box-wrapper">
    <div class="search-box">
        <input type="text" id="handleInput" placeholder="Search name or handle (e.g. jay)" autocomplete="off">
        <button onclick="fetchUserData()">Search</button>
    </div>
    <div id="searchSuggestions" class="search-suggestions hidden"></div>
</div>
            
            <div id="authCard" class="login-wrapper card">
                <div id="loginForm" class="login-grid">
                    <input type="text" id="loginHandle" placeholder="Your handle">
                    <input type="password" id="loginPassword" placeholder="App Password">
                    <button onclick="loginUser()">Login</button>
                </div>
                <div id="loginStatus" class="hidden logged-in-bar">
                    <span class="stat-item">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4cd964" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                        Logged in as <b id="loggedInName"></b>
                    </span>
                    <button class="logout-btn" onclick="logoutUser()">Logout</button>
                </div>
            </div>

            <div id="postComposer" class="card hidden" style="margin-bottom: 20px;">
                <h3 style="margin-top: 0; color: var(--accent);">Create a Post</h3>
                <textarea id="new-post-input" class="reply-input" placeholder="What's up?"></textarea>
                
                <div id="mediaPreviewContainer" class="media-preview-container hidden"></div>
                
                <div id="externalPreviewContainer" class="external-preview-container hidden">
                    <span id="externalPreviewText"></span>
                    <button class="remove-media-btn" onclick="removeExternalLink()">×</button>
                </div>

                <div class="composer-actions">
                    <div class="composer-tools">
                        <button class="tool-btn" onclick="document.getElementById('mediaInput').click()" title="Add Image">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
                            <span>Image</span>
                        </button>
                        <input type="file" id="mediaInput" accept="image/png, image/jpeg, image/webp" multiple style="display: none;" onchange="handleMediaSelect(event)">
                        
                        <button class="tool-btn" onclick="addExternalLink()" title="Add Link or GIF">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
                            <span>Link</span>
                        </button>
                    </div>
                    <div class="action-right">
        <span id="postCharCounter" class="character-counter">0 / 300</span>
                    <button class="submit-reply-btn" onclick="submitPost()">Post</button>
                </div>
            </div>
            </div>

            <div id="profileCard" class="card hidden">
                <div class="header">
                    <img id="pfp" src="" alt="Profile Picture">
                    <div class="user-info">
                        <div class="name-wrapper">
                            <h2 id="displayName"></h2>
                            <svg id="verifiedBadge" class="verified-badge hidden" viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
                                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"></path>
                            </svg>
                            <svg id="trustedBadge" class="verified-badge hidden" viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
                                <path d="M12 1L9.7 3.3H6.5V6.5L4.2 8.8L4.2 12L1.9 14.3L1.9 17.5H5.1V20.7L7.4 23L10.6 23L12.9 25.3L15.2 23L18.4 23V19.8L20.7 17.5L20.7 14.3L23 12L23 8.8L20.7 6.5V3.3H17.5L15.2 1L12 1ZM10.5 16.5L6.5 12.5L7.9 11.1L10.5 13.7L16.1 8.1L17.5 9.5L10.5 16.5Z" transform="scale(0.9)"></path>
                            </svg>
                        </div>
                        <p id="handle"></p>
                    </div>
                </div>
                
                <p id="bio"></p>
                
                <div class="stats">
                    <span class="clickable-stat" onclick="openFollowersModal()"><b id="followers">0</b> Followers</span>
                    <span><b id="following">0</b> Following</span>
                    <span><b id="postsCount">0</b> Posts</span>
                </div>
                
                <div class="profile-tabs">
                    <button class="tab-btn active" onclick="switchTab('posts')">Posts</button>
                    <button class="tab-btn" onclick="switchTab('videos')">Videos</button>
                </div>

                <div id="feed"></div>
                <div id="videoFeed" class="video-grid hidden"></div>
                <div id="scrollSentinel" class="hidden">Loading more posts... <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-left: 5px;"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg></div>
            </div>
        </div>
        
        <footer class="app-footer">
            <p>LycaClient <b>v.1.3</b> // by <a href="https://nulsie.github.io/w" style="color: var(--text-main)">nulsie</a></p>
            <p>Under the MIT License</p>
        </footer>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="script.js"></script>
    
    <div id="toastContainer" class="toast-container"></div>
    <div id="lightbox" class="lightbox hidden" onclick="closeLightbox()">
        <span class="close-lightbox">&times;</span>
        <img id="lightboxImg" src="" alt="Enlarged view">
    </div>
    <div id="followersModal" class="modal hidden">
        <div class="modal-content card">
            <div class="modal-header">
                <h3>Followers</h3>
                <span class="close-modal" onclick="closeFollowersModal()">&times;</span>
            </div>
            <div id="followersList" class="followers-list">
                </div>
        </div>
    </div>
</body>
